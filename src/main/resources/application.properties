spring.application.name=file-management

# ==========================================================
# DATABASE
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/file_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================================
# MULTIPART
# ==========================================================
# Spring's request-level protection.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================================
# OUR FILE CONFIGURATION
# ==========================================================
file.upload-dir=uploads

# 10 MB per file
file.max-size=10485760

# Maximum files in one multipart request
file.max-files=5

# Only these extensions are supported by this reference project.
file.allowed-extensions=pdf,jpg,jpeg,png

# Only these actual/client MIME types are accepted.
file.allowed-content-types=application/pdf,image/jpeg,image/png

# Extension -> expected actual MIME mapping.
file.extension-mime-types.pdf=application/pdf
file.extension-mime-types.jpg=image/jpeg
file.extension-mime-types.jpeg=image/jpeg
file.extension-mime-types.png=image/png
